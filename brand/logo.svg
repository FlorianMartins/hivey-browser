<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Hivey Browser logo: a honeycomb cell (Hivey) holding a globe with an orbit (the web). -->
  <defs>
    <linearGradient id="amber" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFD46B"/>
      <stop offset="0.55" stop-color="#F7A21B"/>
      <stop offset="1" stop-color="#D9730A"/>
    </linearGradient>
    <radialGradient id="globe" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#3A2A12"/>
      <stop offset="1" stop-color="#140E06"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF4D6"/>
      <stop offset="1" stop-color="#FFD46B"/>
    </linearGradient>
  </defs>
  <!-- rounded hexagon, pointy top -->
  <path fill="url(#amber)" d="M116 14.9 Q128 8 140 14.9 L218.9 60.5 Q230.9 67.4 230.9 81.3 L230.9 174.7 Q230.9 188.6 218.9 195.5 L140 241.1 Q128 248 116 241.1 L37.1 195.5 Q25.1 188.6 25.1 174.7 L25.1 81.3 Q25.1 67.4 37.1 60.5 Z"/>
  <!-- globe -->
  <circle cx="128" cy="128" r="62" fill="url(#globe)"/>
  <!-- orbit: back part hidden behind the globe, front part drawn over it -->
  <g transform="rotate(-28 128 128)" fill="none" stroke-linecap="round">
    <path d="M40 128 A88 30 0 0 1 216 128" stroke="#140E06" stroke-width="16" opacity="0.35"/>
    <path d="M40 128 A88 30 0 0 0 216 128" stroke="url(#orbit)" stroke-width="12"/>
  </g>
  <!-- highlight on the globe -->
  <circle cx="106" cy="104" r="12" fill="#FFD46B" opacity="0.9"/>
</svg>
