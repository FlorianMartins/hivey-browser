<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Hivey Browser logo: the Hivey mark of the Hivey AI sidebar
       (third_party/hivey-ai-sidebar/icons/icon.svg), a beehive (skep) of four
       fully-rounded horizontal bars, widest second, smallest at the bottom.
       scripts/branding.py reads the four rects below and snaps them to the
       pixel grid for every icon size it renders. -->
  <defs>
    <linearGradient id="hive" x1="8" y1="8" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d946ef"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <g fill="url(#hive)">
    <rect x="17" y="9" width="62" height="14" rx="7"/>
    <rect x="8" y="30" width="80" height="14" rx="7"/>
    <rect x="12" y="51" width="72" height="14" rx="7"/>
    <rect x="23" y="72" width="50" height="14" rx="7"/>
  </g>
</svg>
