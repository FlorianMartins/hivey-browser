# Installs a (draft) release on a Windows runner and checks it: no network
# request at startup on a fresh profile, then the privacy checks over DevTools.
#
# On a pull request it tests the release built from the branch (the version
# computed from the submodule and HIVEY_REVISION), if a draft or published
# release of that version exists; scripts/autoupdate.py drafts it before
# opening its pull request, so the check gates the merge. By hand: pass a tag.
name: Windows smoke test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (e.g. v156.0.8078.4701), draft or published
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: windows smoke
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      # Draft release assets are only visible with write access.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Release to test
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:INPUT_TAG
          if (-not $tag) {
            $chromium = (Get-Content third_party/ungoogled-chromium/chromium_version.txt).Trim().Split('.')
            $revision = [int](Get-Content HIVEY_REVISION).Trim()
            $tag = "v$($chromium[0]).$($chromium[1]).$($chromium[2]).$([int]$chromium[3] * 100 + $revision)"
          }
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            "No release $tag yet: nothing to install (scripts/release.py draft creates it)." | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "skip=true" | Out-File $env:GITHUB_OUTPUT -Append
            exit 0
          }
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          "skip=false" | Out-File $env:GITHUB_OUTPUT -Append
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.release.outputs.skip == 'false'
        with:
          python-version: "3.12"
      - name: Test dependencies
        if: steps.release.outputs.skip == 'false'
        run: python -m pip install websocket-client==1.8.0 pillow==11.3.0
      - name: Download the installer
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --pattern "*-windows-x64-installer.exe" --dir dist
          # The updater's installer (releases packaged before the setup wizard have none).
          $assets = (gh release view "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --json assets | ConvertFrom-Json).assets.name
          if ($assets -like '*-windows-x64-update.exe') {
            gh release download "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --pattern "*-windows-x64-update.exe" --dir dist
          }
      - name: Install (per user, silent)
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter *-windows-x64-installer.exe | Select-Object -First 1
          $update = Get-ChildItem dist -Filter *-windows-x64-update.exe | Select-Object -First 1
          $default = "$env:LOCALAPPDATA\Hivey\Browser\Application"
          if ($update) {
            # The setup wizard, silent, in a folder of its own (as picked on
            # its directory page): /D= comes last, unquoted.
            $dir = Join-Path $env:RUNNER_TEMP 'Hivey Apps\Hivey Browser'
            $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "setup wizard failed: exit code $($p.ExitCode)" }
          } else {
            # A release packaged before the wizard: the installer is mini_installer.
            $dir = $default
            Start-Process -FilePath $installer.FullName -ArgumentList '--do-not-launch-chrome' -Wait
          }
          $exe = Join-Path $dir 'chrome.exe'
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          if ($update -and (Test-Path "$default\chrome.exe")) { throw "installed in $default instead of $dir" }
          $location = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Hivey Browser').InstallLocation
          if ($location -ne $dir) { throw "registered in $location, not $dir" }
          (Get-Item $exe).VersionInfo | Format-List ProductName, ProductVersion, CompanyName
          "BROWSER=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Update in place (the updater's installer, no folder given)
        if: steps.release.outputs.skip == 'false' && hashFiles('dist/*-windows-x64-update.exe') != ''
        shell: pwsh
        run: |
          # What the browser's updater does: the bare mini_installer, hidden,
          # with --do-not-launch-chrome only. It must find the custom folder.
          $update = Get-ChildItem dist -Filter *-windows-x64-update.exe | Select-Object -First 1
          $p = Start-Process -FilePath $update.FullName -ArgumentList '--do-not-launch-chrome' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "update failed: exit code $($p.ExitCode)" }
          if (-not (Test-Path "$env:INSTALL_DIR\chrome.exe")) { throw "the install left $env:INSTALL_DIR" }
          if (Test-Path "$env:LOCALAPPDATA\Hivey\Browser\Application\chrome.exe") { throw "updated into the default folder" }
      - name: Tor connects (the tor of private windows with Tor)
        if: steps.release.outputs.skip == 'false'
        continue-on-error: true
        shell: pwsh
        run: |
          # The installed tor.exe, alone, until "Bootstrapped 100%" (the
          # release machine cannot reach the Tor network; this runner can).
          $tor = Get-ChildItem -Path $env:INSTALL_DIR -Recurse -Filter tor.exe | Select-Object -First 1
          if (-not $tor) { throw "no tor.exe in $env:INSTALL_DIR" }
          $data = Join-Path $env:RUNNER_TEMP 'tor-data'
          $log = Join-Path $env:RUNNER_TEMP 'tor.log'
          $dir = $tor.DirectoryName
          $p = Start-Process -FilePath $tor.FullName -PassThru -WindowStyle Hidden -ArgumentList `
            '--SocksPort', '127.0.0.1:9399', '--DataDirectory', "`"$data`"", '--GeoIPFile', "`"$dir\geoip`"",
            '--GeoIPv6File', "`"$dir\geoip6`"", '--Log', "`"notice file $log`""
          $deadline = (Get-Date).AddMinutes(3)
          $connected = { (Test-Path $log) -and (Select-String -Path $log -Pattern 'Bootstrapped 100%' -Quiet) }
          while ((Get-Date) -lt $deadline -and -not (& $connected)) {
            Start-Sleep -Seconds 3
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (Test-Path $log) { Get-Content $log -Tail 5 } else { "tor wrote no log" }
          if (-not (& $connected)) { throw "tor did not connect" }
      - name: No request at startup
        if: steps.release.outputs.skip == 'false'
        run: python tests/startup_requests.py "$env:BROWSER" --seconds 60 --keep out
      - name: Privacy checks
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'cdp-profile'
          $browser = Start-Process -FilePath $env:BROWSER -PassThru -ArgumentList @(
            "--user-data-dir=$profile", '--remote-debugging-port=9222', '--no-first-run', 'about:blank')
          Start-Sleep -Seconds 25
          python tests/cdp_checks.py http://127.0.0.1:9222 --shots out/shots
          $code = $LASTEXITCODE
          Stop-Process -Id $browser.Id -Force -ErrorAction SilentlyContinue
          exit $code
      - name: UI screenshots (themes, vertical tabs, Hivey bar)
        if: steps.release.outputs.skip == 'false'
        run: python tests/ui_shots.py "$env:BROWSER" out/ui
      - name: Keep the evidence
        if: always() && steps.release.outputs.skip == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke-${{ steps.release.outputs.tag }}
          path: out/
          if-no-files-found: ignore
