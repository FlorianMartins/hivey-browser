# The local AI prototype's Windows side, without a game or a GPU: downloads and
# verifies the engine and a model, applies the throttling (idle priority,
# EcoQoS, suspend), and measures a simulated game next to it.
name: Local AI prototype

on:
  pull_request:
    branches: [main]
    paths:
      - 'prototypes/local-ai/**'
      - '.github/workflows/local-ai-prototype.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: local AI on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the simulated game
        shell: pwsh
        run: gcc -O2 -static -pthread prototypes/local-ai/frame_sim.c -o frame_sim.exe -lm -lwinmm
      - name: Measure
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File prototypes/local-ai/measure.ps1 -Simulated `
            -FrameSim "$PWD\frame_sim.exe" -Model qwen2.5-1.5b -Seconds 20 -Rounds 1 -WorkDir "$env:RUNNER_TEMP\ai"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP\ai\rapport.json"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-ai-report
          path: ${{ runner.temp }}/ai/rapport.json
          if-no-files-found: ignore
